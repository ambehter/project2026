<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рестораны (React)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<!-- React 18 + Babel (для JSX без сборки) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function RestaurantCard({ r }) {
  return (
    <div className="col">
      <div className="card h-100 shadow-sm">
        <img src={r.image_url} className="card-img-top" style={{height:180, objectFit:'cover'}} alt={r.name}/>
        <div className="card-body">
          <h5 className="card-title">{r.name}</h5>
          <p className="text-muted mb-1">{r.cuisine} · {r.city}</p>
          <p>⭐ {r.rating}</p>
          <a href={`restaurant-detail.html?id=${r.id}`} className="btn btn-primary btn-sm">
            Выбрать столик
          </a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('/backend/index.php/api/restaurants', { credentials: 'include' })
      .then(r => r.json())
      .then(d => setItems(d.data?.items || []))
      .finally(() => setLoading(false));
  }, []);

  if (loading) return <div className="container py-5">Загрузка...</div>;

  return (
    <div className="container py-5">
      <h1>Рестораны</h1>
      <div className="row row-cols-1 row-cols-md-3 g-4">
        {items.map(r => <RestaurantCard key={r.id} r={r} />)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
