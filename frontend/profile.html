<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Личный кабинет</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">🍽 RestBook</div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="restaurants.html">Рестораны</a>
      <span id="guest-links" class="hidden"><a href="login.html">Войти</a></span>
      <span id="user-links">
        <a href="profile.html">Личный кабинет</a>
        <a id="manager-link" href="manager.html" class="hidden">Панель менеджера</a>
        <span class="user-info" id="user-name"></span>
        <a href="#" id="logout-btn">Выйти</a>
      </span>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Личный кабинет</h1>
  <div class="profile-tabs">
    <button class="tab-btn active" data-tab="bookings">Мои брони</button>
    <button class="tab-btn" data-tab="profile">Профиль</button>
    <button class="tab-btn" data-tab="password">Пароль</button>
  </div>

  <section class="tab-panel" id="panel-bookings">
    <div class="filters">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="pending">Ожидает</option>
        <option value="confirmed">Подтверждена</option>
        <option value="cancelled">Отменена</option>
      </select>
      <button class="btn" id="refresh-bookings">Обновить</button>
    </div>
    <div id="bookings-list"></div>
  </section>

  <section class="tab-panel hidden" id="panel-profile">
    <div class="card" style="max-width:480px;">
      <div id="profile-msg"></div>
      <form id="profile-form">
        <div class="form-group"><label>Имя</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Телефон</label><input type="text" name="phone"></div>
        <button class="btn" type="submit">Сохранить</button>
      </form>
    </div>
  </section>

  <section class="tab-panel hidden" id="panel-password">
    <div class="card" style="max-width:480px;">
      <div id="password-msg"></div>
      <form id="password-form">
        <div class="form-group"><label>Текущий пароль</label><input type="password" name="current_password" required></div>
        <div class="form-group"><label>Новый пароль (мин. 6)</label><input type="password" name="new_password" required minlength="6"></div>
        <button class="btn" type="submit">Сменить пароль</button>
      </form>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
