<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Рестораны</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">🍽 RestBook</div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="restaurants.html">Рестораны</a>
      <span id="guest-links">
        <a href="login.html">Войти</a>
        <a href="register.html" class="btn" style="padding:6px 14px;">Регистрация</a>
      </span>
      <span id="user-links" class="hidden">
        <a href="profile.html">Личный кабинет</a>
        <a id="manager-link" href="manager.html" class="hidden">Панель менеджера</a>
        <span class="user-info" id="user-name"></span>
        <a href="#" id="logout-btn">Выйти</a>
      </span>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Рестораны</h1>
  <div class="filters">
    <input id="search" type="text" placeholder="Поиск по названию, городу..." style="flex:1;min-width:220px;">
    <input id="cuisine" type="text" placeholder="Кухня (например, Русская)">
    <button class="btn" id="search-btn">Найти</button>
  </div>
  <div id="list" class="restaurant-grid"></div>
  <div id="empty" class="empty-state hidden">Ничего не найдено</div>
</main>

<script src="js/escape.js"></script>
<script src="js/images.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
// --- ЛОГИКА ЛЕНИВОЙ ЗАГРУЗКИ ---
let imageObserver = null;

function initLazyLoading() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('img[data-src]').forEach(img => {
      if (img.dataset.src) img.src = img.dataset.src;
    });
    return;
  }

  if (!imageObserver) {
    imageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        if (img.dataset.src) img.src = img.dataset.src;
        img.classList.add('is-loaded');
        imageObserver.unobserve(img);
      });
    }, { rootMargin: '200px 0px', threshold: 0.01 });
  }
}

// --- СКЕЛЕТОН ---
function renderSkeleton(container, count = 6) {
  container.innerHTML = Array.from({ length: count }).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-img"></div>
      <div class="skeleton-line" style="width: 70%"></div>
      <div class="skeleton-line" style="width: 40%"></div>
      <div class="skeleton-line" style="width: 55%"></div>
    </div>
  `).join('');
}

// --- ЗАГРУЗКА РЕСТОРАНОВ ---
async function loadRestaurants() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const params = {};
  const s = document.getElementById('search').value.trim();
  const c = document.getElementById('cuisine').value.trim();
  if (s) params.search = s;
  if (c) params.cuisine = c;

  // Показываем скелетоны
  renderSkeleton(list, 6);
  
  try {
    const data = await api.restaurants(params);
    const items = data.items || [];
    
    if (!items.length) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    
    // Рендерим карточки
    list.innerHTML = items.map((r, i) => `
      <a class="restaurant-card" 
         data-aos="fade-up" 
         data-aos-delay="${i * 60}" 
         href="restaurant-detail.html?id=${r.id}">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 320'%3E%3Crect width='520' height='320' fill='%23eee'/%3E%3C/svg%3E"
             data-src="${escapeHtml(getRestaurantImage(r.name))}"
             alt="${escapeHtml(r.name)}"
             width="520" height="320"
             class="lazy-img"
             onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';">
        <div class="restaurant-card-body">
          <h3>${escapeHtml(r.name)}</h3>
          <div class="muted">${escapeHtml(r.cuisine)} · ${escapeHtml(r.city)}</div>
          <div class="muted">⭐ ${escapeHtml(r.rating)}</div>
          <div class="muted">${escapeHtml(r.address)}</div>
        </div>
      </a>
    `).join('');

    // Включаем ленивую загрузку картинок
    initLazyLoading();
    list.querySelectorAll('img[data-src]').forEach(img => imageObserver.observe(img));

    // Обновляем AOS, чтобы карточки появились с анимацией
    if (window.AOS) AOS.refresh();

  } catch (e) {
    list.innerHTML = `<div class="alert error">${escapeHtml(e.message)}</div>`;
  }
}

document.getElementById('search-btn').addEventListener('click', loadRestaurants);
document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadRestaurants(); });
loadRestaurants();
</script>

<!-- Скрипты в самом конце и с атрибутом defer -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    AOS.init({ duration: 600, once: true, offset: 80 });
  });
</script>

<!-- в конце body, после всех скриптов -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
</body>
</html>
