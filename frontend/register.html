<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">🍽 RestBook</div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="restaurants.html">Рестораны</a>
    </nav>
  </div>
</header>

<main class="container" style="max-width:420px;">
  <div class="card">
    <h1>Регистрация</h1>

    <!-- Блок для показа ошибок и сообщений -->
    <div id="msg"></div>

    <form id="reg-form">
      <div class="form-group">
        <label>Логин (латиница и цифры, от 6 символов)</label>
        <input type="text" name="login" required
               pattern="[A-Za-z0-9]{6,}"
               title="Латиница и цифры, от 6 символов">
      </div>
      <div class="form-group">
        <label>ФИО (кириллица)</label>
        <input type="text" name="full_name" required
               pattern="[А-Яа-яЁё\s]+"
               title="Только кириллица и пробелы">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" name="phone" required
               pattern="8\(\d{3}\)\d{3}-\d{2}-\d{2}"
               placeholder="8(999)123-45-67"
               title="Формат: 8(XXX)XXX-XX-XX">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Пароль (мин. 8 символов)</label>
        <input type="password" name="password" required minlength="8">
      </div>
      <button class="btn" type="submit" style="width:100%;">Создать пользователя</button>
    </form>

    <p style="margin-top:14px;font-size:14px;">
      Уже зарегистрированы? <a href="login.html">Авторизация</a>
    </p>
  </div>
</main>

<script src="js/api.js"></script>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const fd = new FormData(e.target);
  try {
    await api.register({
      login:     fd.get('login'),
      full_name: fd.get('full_name'),
      email:     fd.get('email'),
      phone:     fd.get('phone'),
      password:  fd.get('password'),
    });
    location.href = 'profile.html';
  } catch (err) {
    msg.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
